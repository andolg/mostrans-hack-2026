services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mostrans
      POSTGRES_USER: mostrans
      POSTGRES_PASSWORD: mostrans
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostrans -d mostrans"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    cpus: 2.0
    mem_limit: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://mostrans:mostrans@postgres:5432/mostrans
    volumes:
      - ./untracked/data/hourly_2025_jan_oct.csv:/data/hourly_2025_jan_oct.csv:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
