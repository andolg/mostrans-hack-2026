services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mostrans
      POSTGRES_USER: mostrans
      POSTGRES_PASSWORD: mostrans
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostrans -d mostrans"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    cpus: 2.0
    mem_limit: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://mostrans:mostrans@postgres:5432/mostrans
    volumes:
      - ./untracked/data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
